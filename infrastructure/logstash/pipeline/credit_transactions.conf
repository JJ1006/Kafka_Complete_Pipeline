# Logstash Pipeline: Kafka -> Elasticsearch + DLQ
# Consumes credit transactions from Kafka, decodes Avro, indexes to ES

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    topics => ["credit.transactions.v1"]
    group_id => "logstash-credit-consumer"
    consumer_threads => 4
    codec => "plain"
    auto_offset_reset => "earliest"
    session_timeout_ms => 30000
  }
}

filter {
  # Parse Kafka metadata
  mutate {
    add_field => {
      "kafka_topic" => "${[@metadata][kafka][topic]}"
      "kafka_partition" => "${[@metadata][kafka][partition]}"
      "kafka_offset" => "${[@metadata][kafka][offset]}"
      "kafka_timestamp" => "${[@metadata][kafka][timestamp]}"
      "pipeline_timestamp" => "%{+yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}"
    }
  }

  # Decode message body (assumes base64-encoded Avro bytes from Kafka)
  # In production: use Confluent schema registry codec
  ruby {
    code => "
      require 'json'
      require 'base64'

      begin
        # Decode base64 message to binary
        message_bytes = Base64.decode64(event.get('message'))
        
        # For dev: skip binary Avro decoding, assume message is JSON
        # In production: decode Avro using confluent_schema_registry gem
        begin
          event.set('transaction', JSON.parse(event.get('message')))
        rescue JSON::ParserError => e
          event.set('[@metadata][decode_error]', \"Invalid JSON: #{e.message}\")
          event.tag('_dlq')
        end
      rescue StandardError => e
        event.set('[@metadata][decode_error]', \"Decode failed: #{e.message}\")
        event.tag('_dlq')
      end
    "
  }

  # Extract transaction fields
  if ![transaction] or [transaction] == nil {
    mutate {
      add_tag => ["_dlq", "_missing_transaction"]
    }
  } else {
    # Extract required fields
    ruby {
      code => "
        tx = event.get('transaction')
        
        # Validate required fields
        required_fields = ['applicationNumber', 'requestId']
        missing = required_fields.select { |f| tx[f].nil? or tx[f].empty? }
        
        if !missing.empty?
          event.set('[@metadata][validation_error]', \"Missing fields: #{missing.join(', ')}\")
          event.tag('_dlq')
          event.tag('_validation_error')
        else
          # Extract and normalize fields
          event.set('application_number', tx['applicationNumber'])
          event.set('request_id', tx['requestId'])
          event.set('transunion_score', tx['transunionScore'].to_i)
          event.set('loan_amount', tx['loanAmount'].to_f)
          event.set('tenure_months', tx['tenureMonths'].to_i)
          event.set('interest_rate_apr', tx['interestRateApr'].to_f)
          event.set('employment_type', tx['employmentType'].upcase)
          event.set('product_type', tx['productType'].upcase)
          event.set('customer_city', tx['customerCity'])
          event.set('income_monthly', tx['incomeMonthly']&.to_f)
          event.set('existing_debt', tx['existingDebt']&.to_f)
          event.set('schema_version', tx['schemaVersion'])
          event.set('event_id', tx['eventId'])
          event.set('ingested_at', tx['ingestedAt'])
          event.set('source', tx['source'])
          event.set('trace_id', tx['traceId'])
          event.set('correlation_id', tx['correlationId'])
        end
      "
    }
  }

  # Set document_id from composite key (applicationNumber:requestId)
  if ![@metadata][validation_error] {
    ruby {
      code => "
        app_num = event.get('application_number')
        req_id = event.get('request_id')
        if app_num && req_id
          event.set('[@metadata][document_id]', \"#{app_num}:#{req_id}\")
        end
      "
    }
  }

  # Add processing metadata
  mutate {
    add_field => {
      "processed_at" => "%{+yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}"
    }
  }

  # Log to stdout for debugging
  if "_dlq" in [tags] {
    ruby {
      code => "
        event_json = {
          'timestamp' => Time.now.to_i,
          'level' => 'ERROR',
          'message' => 'Message tagged for DLQ',
          'application_number' => event.get('application_number'),
          'document_id' => event.get('[@metadata][document_id]'),
          'errors' => event.get('[@metadata]').select { |k, v| k.end_with?('error') },
          'tags' => event.get('tags')
        }
        puts event_json.to_json
      "
    }
  } else {
    ruby {
      code => "
        event_json = {
          'timestamp' => Time.now.to_i,
          'level' => 'INFO',
          'message' => 'Transaction indexed',
          'application_number' => event.get('application_number'),
          'document_id' => event.get('[@metadata][document_id]'),
          'kafka_offset' => event.get('kafka_offset')
        }
        puts event_json.to_json
      "
    }
  }
}

output {
  # Route to DLQ on validation/decode errors
  if "_dlq" in [tags] {
    kafka {
      bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
      topic_id => "credit.transactions.dlq.v1"
      codec => "json"
    }

    # Also log to stdout for operational visibility
    stdout {
      codec => rubydebug
    }
  } else {
    # Index successful transactions to Elasticsearch
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:localhost:9200}"]
      index => "credit-transactions-write"
      document_id => "%{[@metadata][document_id]}"
      action => "create"
      retry_on_conflict => 3
      timeout => "30s"

      # Retry policy: exponential backoff
      # Default: 1 second initial retry, exponential multiplier
      # Max retries before DLQ routing: handled upstream

      # OTel trace correlation in logs
      ruby {
        code => "
          if event.get('trace_id')
            event.set('[@metadata][trace_id]', event.get('trace_id'))
          end
          if event.get('correlation_id')
            event.set('[@metadata][correlation_id]', event.get('correlation_id'))
          end
        "
      }
    }

    # Log successful indexing to stdout
    stdout {
      codec => "rubydebug"
    }
  }
}
