[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-transaction-platform"
version = "1.0.0"
description = "Production-grade credit transaction ingest & query platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Credit Platform Team", email = "dev@creditplatform.io" }]

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "pydantic==2.6.3",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "aiohttp==3.9.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "slowapi==0.1.9",
    "redis[hiredis]==5.0.3",
    "aiokafka==0.10.0",
    "fastavro==1.9.4",
    "elastic-transport==8.13.0",
    "elasticsearch[async]==8.13.0",
    "opentelemetry-api==1.23.0",
    "opentelemetry-sdk==1.23.0",
    "opentelemetry-instrumentation==0.44b0",
    "opentelemetry-instrumentation-fastapi==0.44b0",
    "opentelemetry-instrumentation-kafka==0.44b0",
    "opentelemetry-instrumentation-redis==0.44b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.23.0",
    "opentelemetry-propagator-jaeger==1.23.0",
    "prometheus-client==0.19.0",
    "prometheus-fastapi-instrumentator==6.1.0",
    "structlog==24.1.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.3.3",
    "mypy==1.9.0",
    "pre-commit==3.7.0",
    "ipython==8.22.2",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.0.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "testcontainers>=4.4.0",
    "factory-boy>=3.3.0",
    "faker>=24.3.0",
    "httpx>=0.27.0",
]

[tool.ruff.format]
# ruff-format is a black-compatible formatter — no need to run both
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line too long, handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = [".venv", "tests"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "fastavro.*",
    "elasticsearch.*",
    "redis.*",
    "opentelemetry.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
    "structlog.*",
    "slowapi.*",
    "passlib.*",
    "jose.*",
    "starlette.*",
]
ignore_missing_imports = true

# OTel and metrics modules use complex generics from optional packages —
# disable the strictest checks where stubs are incomplete or environment-specific
[[tool.mypy.overrides]]
module = [
    "src.api.core.telemetry",
    "src.api.core.metrics",
]
warn_unused_ignores = false
disallow_untyped_defs = false
warn_return_any = false

# Services using Redis async generics behave differently per redis-py version
[[tool.mypy.overrides]]
module = [
    "src.api.services.dedup_service",
    "src.api.services.cache_service",
]
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "contract: Contract tests",
    "load: Load tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80
precision = 2
