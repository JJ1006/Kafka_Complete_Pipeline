name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build & Push multi-arch image ─────────────────────────────────────────────
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: version
        run: echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/credit-api:${{ steps.version.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/credit-api:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update Helm values.yaml with new image tag ────────────────────────────
      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag in Helm values
        run: |
          yq e ".image.tag = \"${{ steps.version.outputs.TAG }}\"" \
            -i infrastructure/helm/credit-api/values.yaml

      - name: Commit updated values.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/credit-api/values.yaml
          git diff --staged --quiet || git commit -m "chore: update credit-api image to ${{ steps.version.outputs.TAG }} [skip ci]"
          git push
